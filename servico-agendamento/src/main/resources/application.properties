# Serviço de Agendamento
server.port=8002

# Banco MySQL (variáveis de ambiente com valor padrão para rodar local)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:db_agendamento}
spring.datasource.username=${DB_USER:clinica}
spring.datasource.password=${DB_PASSWORD:clinica123}

# Cria/atualiza as tabelas sozinho ao iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# URLs dos outros serviços (usadas a partir do CP4)
pacientes.url=${PACIENTES_URL:http://localhost:8001}
notificacoes.url=${NOTIFICACOES_URL:http://localhost:8003}
