# Serviço de Agendamento
# Porta da variável PORT (Railway) ou 8002 local; escuta em todas as interfaces
server.port=${PORT:8002}
server.address=0.0.0.0

# Banco MySQL (variáveis MYSQL* = mesmos nomes que o MySQL do Railway fornece; padrão = local)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3307}/${MYSQLDATABASE:db_agendamento}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQLUSER:clinica}
spring.datasource.password=${MYSQLPASSWORD:clinica123}
# Poucas conexões para economizar memória no Railway
spring.datasource.hikari.maximum-pool-size=5

# Cria/atualiza as tabelas sozinho ao iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# URLs dos outros serviços (chamados pela rede via HTTP)
pacientes.url=${PACIENTES_URL:http://localhost:8001}
notificacoes.url=${NOTIFICACOES_URL:http://localhost:8003}

# Origem do frontend publicado (além de http://localhost:3000), usada no CORS
frontend.url=${FRONTEND_URL:}
